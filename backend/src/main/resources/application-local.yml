# 本地开发：H2 文件数据库（数据保存在 ./data/dreampet.mv.db，重启不丢失）
spring:
  datasource:
    url: jdbc:h2:file:./data/dreampet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.dreampet: DEBUG
