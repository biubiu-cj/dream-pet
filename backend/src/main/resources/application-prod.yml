# 生产：CloudBase PostgreSQL（云托管内网直连）
# 在 CloudBase 控制台「PostgreSQL → 开启直连服务」获取内网地址/端口/库名/账号密码，
# 并通过云托管「服务设置 → 环境变量」注入以下变量（切勿写入代码或 Git）：
#   DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD
spring:
  datasource:
    # 如 CloudBase 直连要求 SSL，可在 DB_PARAMS 中追加 ?sslmode=require 等参数
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}${DB_PARAMS:}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # 免费版 PostgreSQL 连接数有限，小实例保持 3 个连接即可
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 10000
  sql:
    init:
      # 生产建表使用 docs/DATABASE.md 中的 schema-postgres.sql 手动执行一次，
      # 或临时设置为 always（脚本带 IF NOT EXISTS，可重复执行）
      mode: ${DB_INIT_MODE:never}
      schema-locations: classpath:db/schema-postgres.sql
  # 生产禁止开启 H2 控制台（该控制台是独立 Servlet，不经过登录拦截器）
  h2:
    console:
      enabled: false

dreampet:
  # 生产不提供默认值：必须由环境变量注入，否则 StartupSecurityValidator 会拒绝启动
  auth:
    secret: ${AUTH_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  chat:
    # 生产默认只走规则意图识别，节省模型调用；需要更强识别时显式开启
    intent-llm-enabled: ${INTENT_LLM_ENABLED:false}

logging:
  level:
    com.dreampet: INFO
