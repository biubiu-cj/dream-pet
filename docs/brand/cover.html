<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>DreamPet 封面</title>
<style>
  html { zoom: 2; }
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root{
    --cream:#fffaf3; --cream-deep:#fff3e4;
    --sky:#dff1ff; --sky-deep:#a9d8f7; --sky-ink:#5d93bd;
    --pink:#ffd5e0; --pink-deep:#f2a0b6; --peach:#ffd9c2;
    --mint:#d8f5e4; --mint-deep:#7cc9a4;
    --sun:#ffe8a3; --sun-deep:#e9b94e;
    --lavender:#e6ddfb; --lavender-deep:#9c8ad4;
    --ink:#463d52; --ink-soft:#7d7189; --ink-faint:#a99eb5;
    --orange:#f0913c;
  }

  body{
    width:1600px; height:900px; overflow:hidden;
    font-family:"Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC",sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }

  .stage{
    position:relative; width:1600px; height:900px; overflow:hidden;
    background:
      radial-gradient(1100px 760px at 8% -12%,  #fff6e6 0%, rgba(255,246,230,0) 62%),
      radial-gradient(980px 820px at 96% 6%,    #d9f0ff 0%, rgba(217,240,255,0) 66%),
      radial-gradient(1000px 780px at 78% 108%, #d9f6e6 0%, rgba(217,246,230,0) 64%),
      radial-gradient(760px 620px at 24% 112%,  #ffe9ef 0%, rgba(255,233,239,0) 62%),
      linear-gradient(135deg,#fffaf3 0%,#fdf4ff 48%,#eef9ff 100%);
  }

  /* 柔和光斑 */
  .blob{ position:absolute; border-radius:50%; filter:blur(46px); }
  .b1{ width:420px; height:420px; left:-130px; top:-140px; background:rgba(255,232,163,.55); }
  .b2{ width:360px; height:360px; right:160px; top:-120px; background:rgba(169,216,247,.46); }
  .b3{ width:340px; height:340px; left:360px; bottom:-170px; background:rgba(216,245,228,.60); }
  .b4{ width:260px; height:260px; right:-90px; bottom:-80px; background:rgba(230,221,251,.55); }

  /* 星点 */
  .sp{ position:absolute; color:#fff; opacity:.95;
       filter:drop-shadow(0 2px 6px rgba(93,147,189,.18)); }
  .dot{ position:absolute; border-radius:50%; }

  /* ---------- 左侧文案 ---------- */
  .left{ position:absolute; left:96px; top:122px; width:770px; }

  .pill-top{
    display:inline-flex; align-items:center; gap:10px;
    height:46px; padding:0 22px; border-radius:23px;
    background:rgba(255,255,255,.86); border:1px solid rgba(169,216,247,.75);
    box-shadow:0 8px 22px rgba(93,147,189,.12);
    font-size:17px; font-weight:700; color:var(--sky-ink); letter-spacing:.4px;
  }
  .pill-top .spark{ font-size:17px; }

  .logo-row{ display:flex; align-items:flex-end; gap:20px; margin-top:30px; }
  .logo-mark{
    width:86px; height:86px; border-radius:26px;
    background:linear-gradient(140deg,#ffd97a,#f0913c 58%,#ef8a6d);
    box-shadow:0 14px 30px rgba(240,145,60,.30), inset 0 2px 0 rgba(255,255,255,.55);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .logo-mark svg{ width:50px; height:50px; }

  h1{
    font-size:104px; line-height:.98; font-weight:800; letter-spacing:-1.5px;
    background:linear-gradient(118deg,#463d52 0%,#5d93bd 52%,#7cc9a4 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }

  .zh-title{
    margin-top:22px; font-size:44px; font-weight:800; color:var(--ink);
    letter-spacing:1.5px;
  }
  .zh-title em{ font-style:normal; color:var(--orange); }

  .slogan{
    margin-top:18px; font-size:25px; font-weight:600; color:var(--ink-soft);
    letter-spacing:1.2px; display:flex; align-items:center; gap:14px;
  }
  .slogan .bar{ width:52px; height:5px; border-radius:3px;
    background:linear-gradient(90deg,var(--sun-deep),var(--pink-deep)); flex:none; }

  .feat{ display:flex; gap:16px; margin-top:46px; }
  .fcard{
    width:208px; padding:22px 20px 20px; border-radius:24px;
    background:rgba(255,255,255,.90);
    box-shadow:0 16px 34px rgba(93,147,189,.13);
    border:1px solid rgba(255,255,255,.9);
  }
  .fico{ width:48px; height:48px; border-radius:15px; display:flex;
         align-items:center; justify-content:center; margin-bottom:14px; }
  .fico svg{ width:27px; height:27px; }
  .i1{ background:linear-gradient(140deg,#cfe9ff,#a9d8f7); }
  .i2{ background:linear-gradient(140deg,#ffe4ec,#ffc0d2); }
  .i3{ background:linear-gradient(140deg,#dcf7e8,#aee9cb); }
  .fname{ font-size:21px; font-weight:800; letter-spacing:.5px; }
  .fdesc{ margin-top:7px; font-size:14px; line-height:1.55; color:var(--ink-faint); font-weight:600; }

  .tech{ margin-top:40px; display:flex; align-items:center; gap:9px; flex-wrap:nowrap; }
  .tag{
    height:34px; padding:0 14px; border-radius:17px; display:inline-flex; align-items:center;
    font-size:13.5px; font-weight:700; color:var(--ink-soft); white-space:nowrap;
    background:rgba(255,255,255,.72); border:1px solid rgba(169,158,181,.22);
  }
  .tag.hl{ color:#2f6f98; background:rgba(223,241,255,.9); border-color:rgba(169,216,247,.9); }

  /* ---------- 底部条 ---------- */
  .footer{
    position:absolute; left:96px; bottom:52px; width:1410px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .footer .line{
    position:absolute; left:0; top:-26px; width:100%; height:2px; border-radius:1px;
    background:linear-gradient(90deg,rgba(169,216,247,0),rgba(169,216,247,.6) 20%,rgba(242,160,182,.55) 70%,rgba(242,160,182,0));
  }
  .f-left{ display:flex; align-items:center; gap:14px; font-size:16px; font-weight:700; color:var(--ink-soft); }
  .f-left .k{ color:var(--orange); }
  .f-sep{ width:5px; height:5px; border-radius:50%; background:rgba(169,158,181,.5); }
  .f-right{ display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; color:var(--ink-faint); }
  .f-right .safe{
    display:inline-flex; align-items:center; gap:9px; height:38px; padding:0 18px; border-radius:19px;
    background:rgba(216,245,228,.7); border:1px solid rgba(124,201,164,.42);
    font-size:15px; font-weight:700; color:#3f8f6a;
  }
  .f-right .safe svg{ width:18px; height:18px; }

  /* ---------- 右侧角色 ---------- */
  .right{ position:absolute; right:36px; top:0; width:664px; height:900px; }

  /* 舞台光圈 */
  .halo{
    position:absolute; left:50%; top:432px; transform:translate(-50%,-50%);
    width:560px; height:560px; border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.92) 0%,rgba(255,255,255,.45) 46%,rgba(255,255,255,0) 71%);
  }
  .ring{
    position:absolute; left:50%; top:432px; transform:translate(-50%,-50%);
    border-radius:50%; border:2px dashed rgba(169,216,247,.55);
  }
  .r1{ width:470px; height:470px; }
  .r2{ width:600px; height:600px; border-color:rgba(242,160,182,.28); }

  .pet{ position:absolute; filter:drop-shadow(0 16px 24px rgba(93,147,189,.22)); }
  .pet img{ display:block; width:100%; height:auto; }

  .p-main{ width:330px; left:167px; top:238px; z-index:5;
           filter:drop-shadow(0 24px 34px rgba(93,147,189,.28)); }
  .p-cat{ width:166px; left:16px;  top:168px; z-index:3; }
  .p-rab{ width:142px; right:20px; top:156px; z-index:3; }
  .p-bear{ width:162px; left:4px;  top:520px; z-index:4; }
  .p-dino{ width:168px; right:2px; top:512px; z-index:4; }

  .shadow{ position:absolute; border-radius:50%;
           background:radial-gradient(ellipse,rgba(125,113,137,.20),rgba(125,113,137,0) 70%); }
  .s-main{ width:300px; height:52px; left:182px; top:648px; }
  .s-bear{ width:150px; height:30px; left:10px;  top:736px; }
  .s-dino{ width:156px; height:30px; right:8px;  top:728px; }

  /* 气泡 */
  .bubble{
    position:absolute; background:#fff; border-radius:22px;
    padding:13px 19px; font-size:17px; font-weight:700; color:var(--ink);
    box-shadow:0 14px 30px rgba(93,147,189,.18); z-index:8; white-space:nowrap;
  }
  .bubble::after{
    content:""; position:absolute; width:16px; height:16px; background:#fff;
    transform:rotate(45deg); border-radius:3px;
  }
  .bb1{ left:10px; top:96px; }
  .bb1::after{ right:26px; bottom:-6px; }
  .bb2{ right:12px; top:62px; color:#2f6f98; }
  .bb2::after{ right:30px; bottom:-6px; }

  .lv{
    position:absolute; left:50%; transform:translateX(-50%); top:688px; z-index:9;
    display:flex; align-items:center; gap:13px; white-space:nowrap;
    background:#fff; border-radius:26px; padding:12px 22px;
    box-shadow:0 16px 34px rgba(93,147,189,.18);
  }
  .lv .badge{
    height:32px; padding:0 14px; border-radius:16px; display:flex; align-items:center;
    font-size:16px; font-weight:800; color:#7c5a17;
    background:linear-gradient(135deg,#ffd97a,#ffe9a8);
  }
  .lv .bar{ width:118px; height:11px; border-radius:6px; background:#eef2f6; overflow:hidden; }
  .lv .bar i{ display:block; width:62%; height:100%; border-radius:6px;
              background:linear-gradient(90deg,#7fb9e6,#7cc9a4); }
  .lv .txt{ font-size:14.5px; font-weight:700; color:var(--ink-faint); }
</style>
</head>
<body>
<div class="stage">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="blob b3"></div><div class="blob b4"></div>

  <!-- 星点装饰 -->
  <svg class="sp" style="left:842px;top:120px;width:30px;height:30px;" viewBox="0 0 24 24" fill="#ffd97a"><path d="M12 1.6l2.5 6.2 6.6.5-5 4.3 1.6 6.5L12 15.6 6.3 19.1l1.6-6.5-5-4.3 6.6-.5z"/></svg>
  <svg class="sp" style="left:118px;top:690px;width:24px;height:24px;" viewBox="0 0 24 24" fill="#f2a0b6"><path d="M12 1.6l2.5 6.2 6.6.5-5 4.3 1.6 6.5L12 15.6 6.3 19.1l1.6-6.5-5-4.3 6.6-.5z"/></svg>
  <div class="dot" style="left:900px;top:300px;width:12px;height:12px;background:rgba(124,201,164,.75);"></div>
  <div class="dot" style="left:70px;top:200px;width:9px;height:9px;background:rgba(242,160,182,.7);"></div>
  <div class="dot" style="left:1540px;top:420px;width:10px;height:10px;background:rgba(233,185,78,.7);"></div>

  <!-- 左：文案 -->
  <div class="left">
    <div class="pill-top"><span class="spark">✦</span> 面向 6~10 岁儿童的 AI 虚拟伙伴</div>

    <div class="logo-row">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="#fff">
          <path d="M12 21s-7.3-4.6-9.3-9A5.2 5.2 0 0 1 12 6.6a5.2 5.2 0 0 1 9.3 5.4C19.3 16.4 12 21 12 21z"/>
        </svg>
      </div>
      <h1>DreamPet</h1>
    </div>

    <div class="zh-title">AI <em>梦想养成</em>伙伴</div>

    <div class="slogan"><span class="bar"></span>每一次陪伴，都是一次成长</div>

    <div class="feat">
      <div class="fcard">
        <div class="fico i1">
          <svg viewBox="0 0 24 24" fill="none" stroke="#3f7ba8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5.5a3.2 3.2 0 0 1 6 1.4 3 3 0 0 1 1.4 5.3A3.1 3.1 0 0 1 16.5 19 3.2 3.2 0 0 1 12 18M12 5.5A3.2 3.2 0 0 0 6 6.9a3 3 0 0 0-1.4 5.3A3.1 3.1 0 0 0 7.5 19 3.2 3.2 0 0 0 12 18M12 5.5V18"/>
          </svg>
        </div>
        <div class="fname">长期记忆</div>
        <div class="fdesc">话题 · 事件 · 画像<br/>五层记忆，重启不丢</div>
      </div>
      <div class="fcard">
        <div class="fico i2">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c4566f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4 19.5l1.4-4.8A7.5 7.5 0 1 1 20 11.5z"/>
            <path d="M9 11h.01M12.5 11h.01M16 11h.01"/>
          </svg>
        </div>
        <div class="fname">主动陪伴</div>
        <div class="fdesc">意图识别 11 类<br/>会想起你，先开口</div>
      </div>
      <div class="fcard">
        <div class="fico i3">
          <svg viewBox="0 0 24 24" fill="none" stroke="#3f8f6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/>
          </svg>
        </div>
        <div class="fname">成长反馈</div>
        <div class="fdesc">任务 · 经验 · 徽章<br/>4 个阶段看得见</div>
      </div>
    </div>

    <div class="tech">
      <span class="tag hl">Vue 3 + TypeScript</span>
      <span class="tag hl">Spring Boot 3.3</span>
      <span class="tag">MyBatis-Plus</span>
      <span class="tag">PostgreSQL / H2</span>
      <span class="tag">CloudBase 云托管</span>
    </div>
  </div>

  <!-- 右：角色群像 -->
  <div class="right">
    <div class="halo"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>

    <div class="pet p-cat"><img src="../../frontend/src/assets/pets/cat.png" alt="小猫"/></div>
    <div class="pet p-rab"><img src="../../frontend/src/assets/pets/rabbit.png" alt="小兔"/></div>
    <div class="pet p-bear"><img src="../../frontend/src/assets/pets/bear.png" alt="小熊"/></div>
    <div class="pet p-dino"><img src="../../frontend/src/assets/pets/dino.png" alt="小恐龙"/></div>

    <div class="shadow s-bear"></div>
    <div class="shadow s-dino"></div>
    <div class="shadow s-main"></div>
    <div class="pet p-main"><img src="../../frontend/src/assets/pets/fox.png" alt="小狐狸"/></div>

    <div class="bubble bb1">今天也元气满满！</div>
    <div class="bubble bb2">我记得你的梦想 ✦</div>

    <div class="lv">
      <span class="badge">Lv.2</span>
      <span class="bar"><i></i></span>
      <span class="txt">初识伙伴</span>
    </div>
  </div>

  <!-- 底部信息条 -->
  <div class="footer">
    <div class="line"></div>
    <div class="f-left">
      <span>5 种物种 · <span class="k">4 个成长阶段</span></span>
      <i class="f-sep"></i>
      <span>11 类意图识别</span>
      <i class="f-sep"></i>
      <span>8 枚成就徽章</span>
      <i class="f-sep"></i>
      <span>五层长期记忆</span>
    </div>
    <div class="f-right">
      <span class="safe">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3f8f6a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2.8l7.5 3v6c0 4.6-3.2 8.3-7.5 9.4-4.3-1.1-7.5-4.8-7.5-9.4v-6z"/>
          <path d="M8.8 12.2l2.2 2.2 4.2-4.4"/>
        </svg>
        代码级儿童安全防护
      </span>
    </div>
  </div>
</div>
</body>
</html>
